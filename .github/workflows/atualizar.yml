name: Atualizar dados e publicar

on:
  schedule:
    # 3x por dia (horário de Brasília: ~07h, ~13h e ~20h)
    - cron: '7 10 * * *'
    - cron: '7 16 * * *'
    - cron: '7 23 * * *'
  workflow_dispatch:   # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Montar site
        run: |
          mkdir -p _site
          cp -r index.html app.js style.css sw.js manifest.webmanifest icons _site/

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Coletar dados da Pluggy (criptografados)
        env:
          APP_SENHA: ${{ secrets.APP_SENHA }}
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_ITEM_IDS: ${{ secrets.PLUGGY_ITEM_IDS }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/coletar.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
